<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="table.css">
</head>
<body>
    <table>
        <!-- we can also add rowspan and colspan -->
        <caption>Employee details</caption>

        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Fav language</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Vasu</td>
                <td>19</td>
                <td>python</td>
            </tr>
            <tr>
                <td>ujjwal</td>
                <td>19</td>
                <td>Java</td>
            </tr>
        </tbody>
        
        <tfoot>
            <tr>
                <td colspan="3">table footer</td>
            </tr>
        </tfoot>

    </table>
    
</body>
</html>
