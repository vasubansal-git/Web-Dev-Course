        .boxes::before{
            content: "Vasu is good.";
            color: blue;
        }

        .boxes::after{
            content: "Python is fast language.";
            color: red;
        }

        ::selection{
            background-color: rgb(202, 96, 96);
            color: rgb(3, 191, 3);
        }

        .box::first-letter{
            color: purple;
            font-size: 45px;
        }

        input::placeholder{
            color: rgb(114, 114, 145);
        }

</head>
<body>
    <div class="boxes">
        <div data-color="primary" class="box">I am a first box.</div>
        <div class="box">Hey i am a box.</div>
        <div class="box">Hey i am a box.</div>
        <input type="text" placeholder="Type your name here">
