<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5: Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        header{
            position: sticky;
            top: 0;
        }

        nav{
            background-color: pink;
            height: 80px;
        }

        main{
            background-color: black;
            padding: 34px;
        }

        .container{
            background-color: green;
            /* height: 233px; */
            margin: 8px 34px;
            padding: 53px 23px;
            display: flex;
            text-align: center;
        }

        .box1{
            background-color: rgb(223, 107, 126);
            height: 70vh;
            width: 45%;
            margin: 0 12px;
        }

        .box2{
            background-color: blue;
            height: 70vh;
            width: 45%;
            margin: 0 20px;
        }

        .text-box{
            padding: 34px;
            border: 2px solid white;
            margin: 50px 25vw;
            font-size: 2em;
            border-radius: 13px;
        }

        p{
            color: white;
        }

        .orangebox{
            height: 34px;
            width: 34px;
            background: orange;
            position: fixed;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;
        }

        footer{
            background-color: bisque;
            height: 100px;
        }
    </style>
</head>
<body>
    <header>
        <nav>

        </nav>
    </header>
    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text-box">
            <p>Welcome to Sigma Web Development Express.</p>
        </div>

        <div class="orangebox">

        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
