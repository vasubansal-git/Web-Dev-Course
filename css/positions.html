<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS positions properties</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;

            /* Exception */
            /* transform, filter, or perspectives properties can also make an element appear as positioned */
            /* position: absolute; */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }


        .box {
            border: 2px solid black;
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
        }

        .box1 {
            background-color: aqua;
            /* position: absolute; */
            /* z-index: 0; */
            /* top: 0px;
            left: 4px; */
            height: 111px;
            width: 80%;
            margin: 0;
            padding: 0;
            /* position: sticky; */
            position: absolute;
            top: 0px;
            left: 80px;
        }

        .box2 {
            background-color: azure;
            /* position: relative; */
            /* top: -65px;
            left: 90px; */
        }
        .box3 {
            background-color: antiquewhite;
            /* position: fixed;
            top: 400px;
            left: 8vw;
            height: 144px; */
        }
        .box4 {
            background-color: purple;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1">
    
        </div>

        <div class="box box2">
    
        </div>

        <div class="box box3">
    
        </div>

        <div class="box box4">
    
        </div>
    </div>
</body>
</html>
