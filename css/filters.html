<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters Property</title>
    <style>
        /* .img{
            filter: blur(3px);
        } */

        .img1{
            filter: brightness(122%) contrast(1.2);
        }
        .img2{
            /* filter: invert(.61); */
            filter: opacity(0.3);
        }
        .img3{
            /* filter:grayscale(100%); */
            filter: sepia(100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://tse1.mm.bing.net/th/id/OIP.PBl7oVn-vxztfMboFtz_iQHaE8?r=0&pid=Api&h=220&P=0" alt="coding image">

        <img class="img2" src="https://tse2.mm.bing.net/th/id/OIP.qwCptggTe6E4OVJ-nSIDNQHaEe?r=0&pid=Api&h=220&P=0" alt="srk image">

        <img class="img3" src="https://tse3.mm.bing.net/th/id/OIP.mIZF_WBx1HL_xG71G8AIhAHaFj?r=0&pid=Api&h=220&P=0" alt="akshay kumar image">
    </div>
</body>
</html>
