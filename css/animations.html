<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            background-color: rgb(39, 97, 97);
            height: 80vh;
            width: 30vw;
        }

        .box{
            width: 34px;
            height: 45px;
            /* background-color: aqua; */
            /* animation-name: vasuKaAnimation;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(1, 0.41, 0.22, 0.77);
            animation-delay: 2s;
            animation-direction: alternate;
            animation-play-state: paused; */

            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: vasuKaAnimation 3s ease-in-out 3s 1 alternate backwards,
                        vasu2 3s ease-in-out 3s 1;
        }

        @keyframes vasuKaAnimation{
            from{
                background-color: red;
            }
            to{
                background-color: yellowgreen;
                transform: translateX(1000px);
            }
        }

        @keyframes vasu2{
            0%{
                transform: rotate(100deg);
            }
            25%{
                transform: rotate(200deg);
            }
            50%{
                transform: rotate(300deg);
            }
            75%{
                transform: rotate(400deg);
            }
            100%{
                transform: rotate(720deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            box
        </div>
    </div>
</body>
</html>
